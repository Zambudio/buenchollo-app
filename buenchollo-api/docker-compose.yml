services:
  buenchollo-api:
    build: .
    container_name: buenchollo-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # El scheduler corre en su propio contenedor (buenchollo-scheduler, abajo)
      # para no duplicar jobs entre los --workers de uvicorn (M-07/TD-11).
      - SCHEDULER_ENABLED=false
    restart: always
    volumes:
      - .:/app
    # 1) `alembic upgrade head` aplica cualquier migración pendiente al arrancar.
    #    Idempotente: si la BD ya está al día, no hace nada.
    # 2) Si alembic falla (BD caída, migración rota), el contenedor NO arranca.
    #    Esto es intencional: mejor no arrancar que correr con esquema obsoleto.
    # 3) Si NO quieres este comportamiento (p. ej. en local sin permisos),
    #    cambia a:  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # ── Scheduler dedicado (TD-11 desbloqueado 2026-07-18) ──────────────────────
  # Necesario porque buenchollo-api corre con --workers 2: sin esto, los jobs
  # periódicos (mark_expired, clean) se ejecutarían una vez por worker (M-07).
  buenchollo-scheduler:
    build: .
    container_name: buenchollo-scheduler
    env_file:
      - .env
    environment:
      - SCHEDULER_ENABLED=true
    restart: always
    depends_on:
      - buenchollo-api
    volumes:
      - .:/app
    command: python -m app.run_scheduler
    # El HEALTHCHECK del Dockerfile comprueba http://localhost:8000/health,
    # pensado para buenchollo-api (uvicorn). Este contenedor no expone HTTP
    # (solo corre el scheduler), así que ese check siempre falla y Docker lo
    # marca "unhealthy" aunque el proceso esté bien. Lo desactivamos aquí.
    healthcheck:
      disable: true

  # Pasarela del Canal de WhatsApp (docs/guides/WHATSAPP.md): va vinculada a la
  # cuenta que administra el Canal como un dispositivo más (Baileys, sin
  # navegador). Sin puerto publicado: solo la usan la API y el scheduler por la
  # red interna (http://buenchollo-whatsapp:3000) con WHATSAPP_GATEWAY_TOKEN.
  # La sesión vinculada vive en ../whatsapp-gateway/data (fuera de git); el QR
  # para vincular se deja en ../whatsapp-gateway/data/qr.png.
  buenchollo-whatsapp:
    build: ../whatsapp-gateway
    container_name: buenchollo-whatsapp
    restart: always
    # Solo sus dos variables, no todo el .env: este contenedor ejecuta una
    # librería de terceros y no necesita la BD ni el resto de secretos.
    # `docker-compose` (CLI, como se despliega por SSH) las toma del .env del
    # proyecto. Si no se sustituyen (p. ej. desde la interfaz de Container
    # Manager), el token queda vacío y la pasarela se queda en espera sin conectar.
    environment:
      - DATA_DIR=/data
      - WHATSAPP_GATEWAY_TOKEN=${WHATSAPP_GATEWAY_TOKEN:-}
      - WHATSAPP_PAIRING_PHONE=${WHATSAPP_PAIRING_PHONE:-}
    volumes:
      - ../whatsapp-gateway/data:/data

  # Copia de seguridad diaria de la base de datos (AUD-03): pg_dump validado,
  # 14 días de retención en ./backups (fuera de git). Ver
  # docs/guides/BACKUP-RESTORE.md para restaurar. La copia fuera del NAS es
  # decisión del propietario (destino y credenciales).
  db-backup:
    image: postgres:17-alpine
    container_name: buenchollo-db-backup
    restart: always
    env_file:
      - .env
    volumes:
      - ./scripts/db_backup.sh:/db_backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/db_backup.sh"]

  # Cloudflare Tunnel — expone la API en api.buenchollotech.com SIN abrir puertos
  # ni depender de la IP pública (conexión saliente). Por estar en este mismo
  # compose, alcanza la API por el nombre de servicio: http://buenchollo-api:8000
  # (ese es el destino que se configura en el Public Hostname del túnel).
  # Requisito: TUNNEL_TOKEN en el .env del NAS (token del túnel creado en
  # Zero Trust → Tunnels). cloudflared lee la variable TUNNEL_TOKEN del entorno.
  # Usamos env_file (no `environment: ${...}`) porque Synology Container Manager
  # no interpola variables ${...} en el YAML, pero sí inyecta env_file.
  # Con túnel NO se necesita DDNS ni abrir el 443.
  # Versión fijada (no :latest): con --no-autoupdate, actualizar = cambiar el tag
  # aquí + `docker compose pull cloudflared` + recrear. Mínimo 2026.10.2 por el
  # aviso de certificados eMudhra (2026-10-20).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: buenchollo-cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    depends_on:
      - buenchollo-api
      