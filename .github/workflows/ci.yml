name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Mínimo privilegio: el GITHUB_TOKEN solo lee el repositorio (y las PR, que
# gitleaks consulta para escanear sus commits).
permissions:
  contents: read
  pull-requests: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: buenchollo-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: buenchollo-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (errores de sintaxis e imports o nombres sin uso)
        run: ruff check app scripts alembic

      - name: Run pytest (unit only)
        # Los tests marcados `integration` necesitan Postgres: los ejecuta el
        # job «Backend (integración + Postgres)».
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: dummy-service-role-key
          SUPABASE_JWT_SECRET: dummy-jwt-secret
          CORS_ORIGINS: '["*"]'
        run: pytest -q -m "not integration"

  backend-integration:
    name: Backend (integración + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: buenchollo-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_KEY: dummy-service-role-key
      SUPABASE_JWT_SECRET: dummy-jwt-secret
      CORS_ORIGINS: '["*"]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: buenchollo-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Crear esquema de test desde los modelos ORM
        # No se usa `alembic upgrade head`: el esquema base de producción lo
        # crearon las migraciones SQL de Supabase (dependen de auth.* y RLS,
        # irreproducibles en un Postgres vanilla) y Alembic solo versiona
        # cambios incrementales. El grafo ORM es la superficie exacta que
        # ejercitan los repositorios en estos tests.
        run: python scripts/create_test_schema.py

      - name: Run pytest (solo integración)
        # Cierra TD-07: estos tests solo corrían en local antes de cada
        # release. Crean y borran sus propios datos, así que un esquema
        # vacío es suficiente.
        run: pytest -q -m integration

  backend-image:
    name: Backend (imagen Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Construir la imagen de la API
        # El NAS reconstruye esta imagen cuando cambian las dependencias; si una
        # no instala, el fallo aparece aquí y no al reiniciar producción.
        run: docker build --pull -t buenchollo-api:ci buenchollo-api

  whatsapp-gateway:
    name: Pasarela de WhatsApp (tests + imagen)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Construir la imagen
        run: docker build --pull -t buenchollo-whatsapp:ci .

  frontend:
    name: Frontend (typecheck + lint + unit/integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: buenchollo-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: buenchollo-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit + integration) con coverage
        run: npm run test:coverage

      - name: Subir reporte de coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-coverage
          path: buenchollo-web/coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04  # Playwright aún no soporta ubuntu-26.04 (ubuntu-latest desde 2026-10)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: buenchollo-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: buenchollo-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Instalar navegadores Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        # VITE_SUPABASE_* dummy: el cliente Supabase tira al construirse si
        # faltan estas env vars. Con dummies puede inicializarse, getSession
        # devuelve null (no hay nada en localStorage) y los tests del guard
        # de admin (/admin → /login) funcionan. NO se intenta autenticar
        # contra Supabase real; cualquier fetch falla → tratado como sin
        # sesión, que es justo lo que queremos en E2E sin credenciales.
        env:
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key-for-tests
          VITE_API_URL: http://localhost:9999
        run: npm run test:e2e

      - name: Subir reporte HTML de Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            buenchollo-web/playwright-report/
            buenchollo-web/test-results/
          retention-days: 7

  security-audit:
    name: Security audit (deps + secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks necesita el historial para escanear todos los commits.
          fetch-depth: 0

      # ── Python: pip-audit sobre las deps de producción ────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: buenchollo-api/requirements.txt

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: pip-audit (backend deps)
        # --strict: falla si encuentra CUALQUIER vulnerabilidad. Si en el
        # futuro se acepta una excepción documentada, usar --ignore-vuln <ID>.
        run: pip-audit -r buenchollo-api/requirements.txt --strict

      # ── Node: npm audit sobre deps de producción ──────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: buenchollo-web/package-lock.json

      - name: Instalar deps frontend
        working-directory: buenchollo-web
        run: npm ci

      - name: npm audit (deps de producción, fallar en high)
        # Los plugins de build (vite, @cloudflare/vite-plugin, @tailwindcss/vite,
        # @tanstack/router-plugin, vite-tsconfig-paths) viven en devDependencies y
        # se excluyen con --omit=dev. Desde 2026-10-27 el audit está a 0
        # (incluidas devDeps), así que el umbral bloqueante es `high`. Los
        # parches transitivos que el upstream aún no trae van en `overrides`
        # de package.json (undici vía miniflare, postcss-selector-parser vía
        # @tailwindcss/typography): quitarlos cuando el paquete padre los incluya.
        # Si un aviso no tiene versión corregida, se acepta de forma explícita y
        # con fecha de revisión en buenchollo-web/audit-allowlist.json (el script
        # falla con cualquier otro high/critical y con excepciones vencidas).
        working-directory: buenchollo-web
        run: npm run audit:prod

      # ── gitleaks: detectar secretos hardcoded en el código y el historial ─
      - name: Escaneo de secretos con gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
